name: Deploy AeroGuard Presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Presentation
        run: |
          quarto render presentation/final_presentation.qmd --to revealjs

      - name: Prepare deployment files
        run: |
          mkdir -p _site
          cp -r presentation/final_presentation.html _site/index.html
          cp -r presentation/final_presentation_files _site/ 2>/dev/null || true
          cp -r presentation/style.css _site/ 2>/dev/null || true
          cp -r presentation/images _site/ 2>/dev/null || true
          cp -r images _site/images_root 2>/dev/null || true
          # Create a simple redirect for the root images
          mkdir -p _site/images
          cp -r images/* _site/images/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
