name: Deploy AeroGuard Presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Presentation
        working-directory: presentation
        run: |
          quarto render final_presentation.qmd --to revealjs

      - name: Prepare deployment files
        run: |
          mkdir -p deploy
          # Copy the rendered HTML as index.html
          cp presentation/final_presentation.html deploy/index.html
          # Copy the generated assets
          cp -r presentation/final_presentation_files deploy/ 2>/dev/null || true
          # Copy CSS
          cp presentation/style.css deploy/ 2>/dev/null || true
          # Copy images from presentation folder
          cp -r "presentation/images" deploy/ 2>/dev/null || true
          # Also copy images from root folder
          mkdir -p deploy/images
          cp -r images/* deploy/images/ 2>/dev/null || true
          # Create a .nojekyll file to bypass Jekyll processing
          touch deploy/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
