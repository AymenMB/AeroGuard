name: Deploy AeroGuard Presentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Presentation
        working-directory: presentation
        run: |
          quarto render final_presentation.qmd --to revealjs

      - name: Prepare deployment files
        run: |
          mkdir -p _site
          # Copy the rendered HTML as index.html
          cp presentation/final_presentation.html _site/index.html
          # Copy the generated assets
          cp -r presentation/final_presentation_files _site/ 2>/dev/null || true
          # Copy CSS
          cp presentation/style.css _site/ 2>/dev/null || true
          # Copy images from presentation folder (with proper quoting for spaces)
          cp -r "presentation/images" _site/ 2>/dev/null || true
          # Also copy images from root folder
          cp -r images/* _site/images/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
